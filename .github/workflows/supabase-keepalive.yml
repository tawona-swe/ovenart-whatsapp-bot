name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days with no API activity.
# This pings the project every 3 days so it never goes idle long enough to pause —
# runs on GitHub's infra, independent of whether the bot's own host (Render) is awake.

on:
  schedule:
    - cron: "0 6 */3 * *" # 06:00 UTC, every 3 days
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query a real table to register as database activity
        # Hitting the bare /rest/v1/ root only touches the PostgREST gateway,
        # not the database itself — Supabase's inactivity check tracks actual
        # query activity, so a real (if tiny) table read is what counts.
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/customers?select=phone&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 400 ]; then
            echo "Query failed — check table/RLS/credentials"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
