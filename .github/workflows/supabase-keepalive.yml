name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days with no API activity.
# This pings the project every 3 days so it never goes idle long enough to pause —
# runs on GitHub's infra, independent of whether the bot's own host (Render) is awake.

on:
  schedule:
    - cron: "0 6 */3 * *" # 06:00 UTC, every 3 days
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 500 ]; then
            echo "Supabase appears down/unreachable"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
