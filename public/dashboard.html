<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oven Art — Dashboard</title>
<style>
  :root {
    /* Sampled from public/images/logo.png — Oven Art's real palette */
    --bg: #F2F4F6;
    --panel: #ffffff;
    --border: #E1E6EA;
    --ink: #15202B;
    --muted: #5C6B7A;
    --navy: #0A3758;
    --navy-dark: #121E36;
    --accent: #EA713C;
    --accent-soft: #FCE4D6;
    --gold: #F7B916;
    --open: #088D58;
    --open-soft: #DFF2E7;
    --closed: #C0392B;
    --closed-soft: #FBE1DD;
    --bubble-in: #EEF1F4;
    --bubble-out: var(--accent-soft);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }

  #tabs {
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--navy);
    flex-shrink: 0;
    padding: 0 10px;
  }
  #tabs img { height: 30px; margin: 8px 12px 8px 4px; border-radius: 4px; }
  #tabs button {
    border: none;
    background: none;
    padding: 16px 16px;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255, 255, 255, .62);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  #tabs button:hover { color: rgba(255, 255, 255, .85); }
  #tabs button.active { color: #fff; border-bottom-color: var(--gold); }

  #views { flex: 1; min-height: 0; display: flex; }
  .view { flex: 1; display: none; min-width: 0; }
  .view.active { display: flex; }

  /* ─── Inbox view ──────────────────────────────────────────────────────── */
  #list {
    width: 320px;
    min-width: 240px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }
  #list h1 {
    font-size: 15px;
    padding: 16px;
    margin: 0;
    border-bottom: 1px solid var(--border);
  }
  .convo {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .convo:hover { background: var(--bg); }
  .convo.active { background: var(--bubble-out); }
  .convo .name { font-weight: 600; font-size: 14px; }
  .convo .phone { font-size: 12px; color: var(--muted); }
  .convo .countdown { font-size: 11px; color: var(--muted); }
  .convo .preview { font-size: 12.5px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  .dot.open { background: var(--open); }
  .dot.closed { background: var(--closed); }

  #thread-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #thread-header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  #thread-header .status { font-size: 12px; margin-top: 2px; }
  #thread-header .status.open { color: var(--open); }
  #thread-header .status.closed { color: var(--closed); }

  #thread { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 60%; padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
  .bubble.in { align-self: flex-start; background: var(--bubble-in); }
  .bubble.out { align-self: flex-end; background: var(--bubble-out); }
  .bubble .time { display: block; font-size: 10.5px; color: var(--muted); margin-top: 4px; }

  #reply-bar { padding: 14px 20px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 10px; }
  #reply-text { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; resize: none; font-family: inherit; }
  #reply-send { padding: 0 20px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  #reply-send:disabled { background: #C7CED4; cursor: not-allowed; }
  #reply-warning { padding: 8px 20px; font-size: 12.5px; color: var(--closed); background: var(--closed-soft); display: none; }

  #empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }

  /* ─── Customers view ──────────────────────────────────────────────────── */
  #customers-view { flex-direction: column; overflow-y: auto; background: var(--panel); }
  #customers-view h1 { font-size: 15px; padding: 16px 20px; margin: 0; border-bottom: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted); padding: 10px 20px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 10px 20px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:hover { background: var(--bg); }
  #customers-empty, #orders-empty { padding: 20px; color: var(--muted); font-size: 14px; }

  /* ─── Verification view ───────────────────────────────────────────────── */
  #orders-view { flex-direction: column; overflow-y: auto; background: var(--panel); }
  #orders-view h1 { font-size: 15px; padding: 16px 20px; margin: 0; border-bottom: 1px solid var(--border); }
  #orders-list { display: flex; flex-direction: column; }
  .order-card { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: flex-start; }
  .order-card .main { flex: 1; min-width: 0; }
  .order-card .top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .order-card .name { font-weight: 600; font-size: 14px; }
  .order-card .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .order-card .items { font-size: 13px; margin-top: 6px; white-space: pre-wrap; }
  .badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 3px 8px; border-radius: 999px; }
  .badge.pending { background: var(--accent-soft); color: var(--accent); }
  .badge.confirmed { background: var(--open-soft); color: var(--open); }
  .badge.rejected { background: var(--closed-soft); color: var(--closed); }
  .order-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .order-actions button { border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-approve { background: var(--open); color: #fff; }
  .btn-reject { background: var(--closed); color: #fff; }

  /* ─── Daily Sheet view ────────────────────────────────────────────────── */
  #sheet-view { flex-direction: column; overflow-y: auto; background: var(--panel); }
  #sheet-toolbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  #sheet-toolbar h1 { font-size: 15px; margin: 0; flex: 1; min-width: 200px; }
  #sheet-date { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13.5px; font-family: inherit; }
  #sheet-print { border: none; border-radius: 8px; padding: 9px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer; background: var(--navy); color: #fff; }
  #sheet-summary { font-size: 12.5px; color: var(--muted); padding: 10px 20px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #sheet-summary b { color: var(--ink); }
  .badge.open-window { background: var(--open-soft); color: var(--open); }
  .badge.closed-window { background: var(--border); color: var(--muted); }

  #print-header { display: none; }
  @media print {
    #tabs, #sheet-toolbar { display: none !important; }
    body, #views, #sheet-view { display: block !important; overflow: visible !important; height: auto !important; }
    #print-header { display: block; padding: 0 0 12px; }
    #print-header h2 { margin: 0 0 2px; font-size: 18px; }
    #print-header div { font-size: 12px; color: #555; }
    table { font-size: 12px; }
  }
</style>
</head>
<body>
  <div id="tabs">
    <img src="/images/logo.png" alt="Oven Art">
    <button id="tab-inbox" class="active">Inbox</button>
    <button id="tab-verification">Verification</button>
    <button id="tab-sheet">Daily Sheet</button>
    <button id="tab-customers">Customers</button>
  </div>

  <div id="views">
    <div id="inbox-view" class="view active">
      <div id="list"><h1>Conversations</h1></div>
      <div id="thread-wrap">
        <div id="empty">Select a conversation</div>
      </div>
    </div>

    <div id="orders-view" class="view">
      <h1>Order verification — outlets outside Harare need manual review</h1>
      <div id="orders-list"></div>
    </div>

    <div id="sheet-view" class="view">
      <div id="sheet-toolbar">
        <h1>Daily dispatch sheet</h1>
        <input type="date" id="sheet-date">
        <button id="sheet-print">Print</button>
      </div>
      <div id="sheet-summary"></div>
      <div id="print-header">
        <h2>Oven Art Bakery — Dispatch Sheet</h2>
        <div id="print-header-sub"></div>
      </div>
      <div id="sheet-table"></div>
    </div>

    <div id="customers-view" class="view">
      <h1>Registered customers / outlets</h1>
      <div id="customers-table"></div>
    </div>
  </div>

<script>
let activePhone = null;
let pollTimer = null;
let activeTab = "inbox";

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (res.status === 401) { document.body.innerHTML = "Auth required — reload the page."; throw new Error("401"); }
  return res;
}

function esc(s) {
  return (s || "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function fmtTime(ts) {
  return new Date(ts).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function fmtDate(iso) {
  return iso ? new Date(iso).toLocaleDateString([], { year: "numeric", month: "short", day: "numeric" }) : "—";
}

/** "18h 42m left" / "42m left" / "Closed" / "" (never messaged) from an expiry timestamp. */
function fmtCountdown(expiresAt) {
  if (!expiresAt) return "";
  const msLeft = expiresAt - Date.now();
  if (msLeft <= 0) return "Closed";
  const h = Math.floor(msLeft / 3600000);
  const m = Math.floor((msLeft % 3600000) / 60000);
  return h > 0 ? `${h}h ${m}m left` : `${m}m left`;
}

// ─── Dispatch window math (Africa/Harare is fixed UTC+2, no DST) ───────────
// A dispatch window for date D covers confirmations from D-1 14:00 to D 14:00
// Harare time — i.e. 12:00 UTC the previous day to 12:00 UTC on D. Anything
// confirmed after D's 2pm cutoff automatically falls into D+1's window.
const CUTOFF_UTC_HOUR = 12; // 14:00 Harare == 12:00 UTC

function windowEndMs(y, m, d) {
  return Date.UTC(y, m - 1, d, CUTOFF_UTC_HOUR, 0, 0);
}

/** {y,m,d} of "now" as a Harare calendar date (UTC+2 shift trick). */
function hararePartsNow() {
  const shifted = new Date(Date.now() + 2 * 3600 * 1000);
  return { y: shifted.getUTCFullYear(), m: shifted.getUTCMonth() + 1, d: shifted.getUTCDate() };
}

/** Today's window if before 2pm Harare, otherwise tomorrow's (the one now accumulating). */
function defaultDispatchDateStr() {
  const shifted = new Date(Date.now() + 2 * 3600 * 1000);
  const hour = shifted.getUTCHours();
  let { y, m, d } = hararePartsNow();
  if (hour >= 14) {
    const next = new Date(Date.UTC(y, m - 1, d + 1));
    y = next.getUTCFullYear(); m = next.getUTCMonth() + 1; d = next.getUTCDate();
  }
  return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

function parseDateStr(str) {
  const [y, m, d] = str.split("-").map(Number);
  return { y, m, d };
}

// ─── Tabs ─────────────────────────────────────────────────────────────────
const TABS = ["inbox", "verification", "sheet", "customers"];
function switchTab(tab) {
  activeTab = tab;
  for (const t of TABS) {
    document.getElementById(`tab-${t}`).classList.toggle("active", t === tab);
  }
  document.getElementById("inbox-view").classList.toggle("active", tab === "inbox");
  document.getElementById("orders-view").classList.toggle("active", tab === "verification");
  document.getElementById("sheet-view").classList.toggle("active", tab === "sheet");
  document.getElementById("customers-view").classList.toggle("active", tab === "customers");
  if (tab === "customers") loadCustomers();
  if (tab === "verification") loadOrders();
  if (tab === "sheet") loadSheet();
}
for (const t of TABS) {
  document.getElementById(`tab-${t}`).addEventListener("click", () => switchTab(t));
}

// ─── Verification tab ───────────────────────────────────────────────────────
/** Plain-text items display — grouped by shop for merchandise orders. */
function orderItemsText(o) {
  if (o.shops) {
    return o.shops.map((s) => `${s.name}:\n${s.itemsText.split("; ").join("\n")}`).join("\n\n");
  }
  return o.itemsText.split("; ").join("\n");
}

async function loadOrders() {
  const res = await api("/api/orders");
  const list = await res.json();
  const el = document.getElementById("orders-list");

  if (list.length === 0) {
    el.innerHTML = `<div id="orders-empty">No orders yet.</div>`;
    return;
  }

  el.innerHTML = list.map((o) => `
    <div class="order-card" data-id="${o.id}">
      <div class="main">
        <div class="top">
          <span class="name">${esc(o.name)}</span>
          <span class="badge ${o.status}">${o.status}</span>
        </div>
        <div class="meta">${esc(o.phone)} — ${esc(o.address)} (${esc(o.city || "unknown city")})</div>
        <div class="meta">${esc(o.fulfillment)}${o.shops ? ` — ${o.shops.length} shops` : ""} — Total $${esc(o.total)} — ${fmtTime(o.createdAt)}</div>
        <div class="items">${esc(orderItemsText(o))}</div>
      </div>
      ${o.status === "pending" ? `
        <div class="order-actions">
          <button class="btn-approve" data-action="approve" data-id="${o.id}">Approve</button>
          <button class="btn-reject" data-action="reject" data-id="${o.id}">Reject</button>
        </div>
      ` : ""}
    </div>
  `).join("");

  el.querySelectorAll("button[data-action]").forEach((btn) => {
    btn.addEventListener("click", () => reviewOrder(btn.dataset.id, btn.dataset.action));
  });
}

async function reviewOrder(id, action) {
  const res = await api(`/api/orders/${id}/${action}`, { method: "POST" });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    alert(err.error || `Failed to ${action}.`);
    return;
  }
  await loadOrders();
}

// ─── Daily Sheet tab ──────────────────────────────────────────────────────────
const sheetDateInput = document.getElementById("sheet-date");
sheetDateInput.value = defaultDispatchDateStr();
sheetDateInput.addEventListener("change", loadSheet);
document.getElementById("sheet-print").addEventListener("click", () => window.print());

async function loadSheet() {
  const dateStr = sheetDateInput.value || defaultDispatchDateStr();
  const { y, m, d } = parseDateStr(dateStr);
  const windowEnd = windowEndMs(y, m, d);
  const windowStart = windowEnd - 24 * 3600 * 1000;
  const isOpen = windowEnd > Date.now();

  const res = await api("/api/orders");
  const all = await res.json();
  const list = all
    .filter((o) => o.status === "confirmed" && o.reviewedAt >= windowStart && o.reviewedAt < windowEnd)
    .sort((a, b) => a.reviewedAt - b.reviewedAt);

  const cutoffLabel = new Date(windowEnd).toLocaleString([], {
    month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
  });
  const prevDayLabel = new Date(windowStart).toLocaleString([], { month: "short", day: "numeric" });

  document.getElementById("sheet-summary").innerHTML = `
    <span><b>${list.length}</b> order${list.length === 1 ? "" : "s"}</span>
    <span>Window: ${esc(prevDayLabel)} 2:00 PM → ${esc(cutoffLabel)} (Harare time)</span>
    <span class="badge ${isOpen ? "open-window" : "closed-window"}">${isOpen ? "Still accumulating" : "Closed — final"}</span>
  `;
  document.getElementById("print-header-sub").textContent =
    `Dispatch window ending ${cutoffLabel} — generated ${new Date().toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}`;

  const tableEl = document.getElementById("sheet-table");
  if (list.length === 0) {
    tableEl.innerHTML = `<div id="orders-empty">No confirmed orders in this window yet.</div>`;
    return;
  }

  tableEl.innerHTML = `
    <table>
      <thead>
        <tr><th>Time</th><th>Name / Outlet</th><th>Phone</th><th>Fulfillment</th><th>Items</th><th>Total</th></tr>
      </thead>
      <tbody>
        ${list.map((o) => `
          <tr>
            <td>${new Date(o.reviewedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</td>
            <td>${esc(o.name)}</td>
            <td>${esc(o.phone)}</td>
            <td>${esc(o.fulfillment)}</td>
            <td style="white-space: pre-wrap;">${esc(orderItemsText(o))}</td>
            <td>$${esc(o.total)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

// ─── Customers tab ──────────────────────────────────────────────────────────
async function loadCustomers() {
  const res = await api("/api/customers");
  const list = await res.json();
  const el = document.getElementById("customers-table");

  if (list.length === 0) {
    el.innerHTML = `<div id="customers-empty">No one's registered yet.</div>`;
    return;
  }

  el.innerHTML = `
    <table>
      <thead>
        <tr><th>Name / Outlet</th><th>Phone</th><th>Address</th><th>City</th><th>Registered</th></tr>
      </thead>
      <tbody>
        ${list.map((c) => `
          <tr>
            <td>${esc(c.name)}</td>
            <td>${esc(c.phone)}</td>
            <td>${esc(c.address)}</td>
            <td>${esc(c.city)}</td>
            <td>${fmtDate(c.registeredAt)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

// ─── Inbox tab ──────────────────────────────────────────────────────────────
async function loadConversations() {
  const res = await api("/api/conversations");
  const list = await res.json();
  const el = document.getElementById("list");
  el.innerHTML = "<h1>Conversations</h1>" + list.map((c) => `
    <div class="convo ${c.phone === activePhone ? "active" : ""}" data-phone="${c.phone}" data-expires="${c.windowExpiresAt || ""}">
      <div class="name"><span class="dot ${c.windowOpen ? "open" : "closed"}"></span>${esc(c.name || c.phone)}</div>
      <div class="phone">${c.phone} <span class="countdown">${fmtCountdown(c.windowExpiresAt)}</span></div>
      <div class="preview">${esc(c.lastMessage ? c.lastMessage.text : "")}</div>
    </div>
  `).join("");
  el.querySelectorAll(".convo").forEach((row) => {
    row.addEventListener("click", () => openConversation(row.dataset.phone));
  });
}

async function openConversation(phone) {
  activePhone = phone;
  await loadConversations();

  // Build the chrome (header + reply bar) ONCE per conversation switch —
  // the poll below only touches the message list, so it never wipes
  // whatever the sales person is mid-typing into the reply box.
  document.getElementById("thread-wrap").innerHTML = `
    <div id="thread-header">
      <div><strong id="thread-name"></strong> — <span id="thread-phone"></span></div>
      <div id="thread-status" class="status"></div>
      <div id="thread-countdown" class="status"></div>
    </div>
    <div id="thread"></div>
    <div id="reply-warning">This conversation's 24h window is closed — a message sent now would need an approved template.</div>
    <div id="reply-bar">
      <textarea id="reply-text" rows="1" placeholder="Type a reply..."></textarea>
      <button id="reply-send">Send</button>
    </div>
  `;
  document.getElementById("reply-send").addEventListener("click", sendReply);
  document.getElementById("reply-text").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendReply(); }
  });

  await loadThread();
  clearInterval(pollTimer);
  pollTimer = setInterval(loadThread, 4000);
}

let activeThreadExpiresAt = null;

async function loadThread() {
  if (!activePhone) return;
  const res = await api(`/api/conversations/${encodeURIComponent(activePhone)}/messages`);
  const data = await res.json();

  document.getElementById("thread-name").textContent = data.name || activePhone;
  document.getElementById("thread-phone").textContent = activePhone;
  const statusEl = document.getElementById("thread-status");
  statusEl.className = `status ${data.windowOpen ? "open" : "closed"}`;
  statusEl.textContent = data.windowOpen ? "Window open — free replies" : "Window closed — needs a template to message first";

  activeThreadExpiresAt = data.windowExpiresAt;
  renderThreadCountdown();

  const threadEl = document.getElementById("thread");
  const wasAtBottom = threadEl.scrollTop + threadEl.clientHeight >= threadEl.scrollHeight - 20;
  threadEl.innerHTML = data.messages.map((m) => `
    <div class="bubble ${m.direction}">${esc(m.text)}<span class="time">${fmtTime(m.at)}</span></div>
  `).join("");
  if (wasAtBottom) threadEl.scrollTop = threadEl.scrollHeight;

  document.getElementById("reply-warning").style.display = data.windowOpen ? "none" : "block";
  // Only touch enabled state, never .value — never disturb text mid-typing.
  document.getElementById("reply-text").disabled = !data.windowOpen;
  document.getElementById("reply-send").disabled = !data.windowOpen;
}

function renderThreadCountdown() {
  const el = document.getElementById("thread-countdown");
  if (!el) return;
  el.textContent = activeThreadExpiresAt ? fmtCountdown(activeThreadExpiresAt) : "";
}

/** Re-render countdown text from already-fetched data — no network call. */
function tickCountdowns() {
  renderThreadCountdown();
  document.querySelectorAll(".convo").forEach((row) => {
    const expires = Number(row.dataset.expires) || null;
    const el = row.querySelector(".countdown");
    if (el) el.textContent = fmtCountdown(expires);
  });
}

async function sendReply() {
  const textEl = document.getElementById("reply-text");
  const text = textEl.value.trim();
  if (!text) return;
  textEl.disabled = true;
  const res = await api(`/api/conversations/${encodeURIComponent(activePhone)}/reply`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  if (res.ok) {
    textEl.value = "";
    await loadThread();
  } else {
    const err = await res.json().catch(() => ({}));
    alert(err.error || "Failed to send.");
  }
  textEl.disabled = false;
  textEl.focus();
}

loadConversations();
setInterval(() => { if (activeTab === "inbox") loadConversations(); }, 5000);
setInterval(() => { if (activeTab === "customers") loadCustomers(); }, 5000);
setInterval(() => { if (activeTab === "verification") loadOrders(); }, 5000);
setInterval(() => { if (activeTab === "sheet") loadSheet(); }, 10000);
setInterval(tickCountdowns, 30000);
</script>
